name: Validate ebuilds

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: validate-ebuilds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgcheck:
    name: pkgcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gentoo packages
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --commits origin/main..HEAD
